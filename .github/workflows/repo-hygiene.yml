name: Repository Hygiene

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify tracked-file hygiene
        run: bash scripts/check-repo-hygiene.sh
